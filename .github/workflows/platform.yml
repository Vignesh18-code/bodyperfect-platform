name: Platform verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clinicapp_test
          POSTGRES_USER: clinicapp_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinicapp_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: clinicapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: clinicapp/pom.xml
      - name: PostgreSQL regression
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/clinicapp_test
          TEST_DATABASE_USERNAME: clinicapp_test
          TEST_DATABASE_PASSWORD: isolated-ci-only
        run: ./scripts/test-postgres.sh --batch-mode
      - run: mvn --batch-mode package -DskipTests
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker build -t bodyperfect-dashboard:verify .
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ant
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Compilation check only; release builds must use the real HTTPS endpoint.
      - run: flutter build web --dart-define=API_BASE_URL=https://api.example.com
