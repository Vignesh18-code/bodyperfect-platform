server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_ssl_server_name on;
    # Route HTTPS upstreams by their own hostname (required by Railway).
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
