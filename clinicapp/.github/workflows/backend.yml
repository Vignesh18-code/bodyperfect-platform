name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clinicapp_test
          POSTGRES_USER: clinicapp_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinicapp_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Migration-backed regression tests
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/clinicapp_test
          TEST_DATABASE_USERNAME: clinicapp_test
          TEST_DATABASE_PASSWORD: isolated-ci-only
        run: ./scripts/test-postgres.sh --batch-mode
      - name: Package tested source
        run: mvn --batch-mode package -DskipTests
