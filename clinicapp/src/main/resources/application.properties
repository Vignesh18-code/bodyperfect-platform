spring.application.name=clinicapp

server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clinicapp}

spring.datasource.username=${DATABASE_USERNAME:clinicapp}

spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
app.upload.dir=uploads
app.rate-limit.auth.max-attempts=20
app.rate-limit.auth.window-seconds=60

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

app.secrets.encryption-key=${APP_SECRETS_ENCRYPTION_KEY:}
app.policy.privacy-url=${PRIVACY_POLICY_URL:}
app.policy.terms-url=${TERMS_URL:}
app.policy.contact-email=${PRIVACY_CONTACT_EMAIL:}
app.policy.legal-name=${CLINIC_LEGAL_NAME:}
app.policy.retention-notice=${RETENTION_NOTICE:}

app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:${spring.mail.username:}}
