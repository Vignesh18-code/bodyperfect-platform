# Local IntelliJ development on this Mac: activate the "local" profile.
# Connects to the existing ant_db; does not create or reset a database.
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${LOCAL_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/ant_db}
spring.datasource.username=${LOCAL_DATABASE_USERNAME:vignesh}
spring.datasource.password=${LOCAL_DATABASE_PASSWORD:}

# Keep JWT_SECRET in the private IntelliJ environment configuration.
# Test email goes to the local Mailpit inbox when Mailpit is running.
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=local@example.test
spring.mail.password=local-only
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
app.bootstrap.enabled=false
app.staff.cookie-secure=false
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

# Private local AI key; never packaged into a client build.
spring.config.import=optional:file:../.local/ai.properties
