spring.datasource.url=jdbc:h2:mem:clinicapp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test

jwt.secret=TestClinicAppJwtSecretKeyForAutomatedTestsOnly256BitsLong
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.upload.dir=${java.io.tmpdir}/clinicapp-test-uploads
app.rate-limit.auth.max-attempts=1000
app.rate-limit.auth.window-seconds=60

management.endpoints.web.exposure.include=health,info
